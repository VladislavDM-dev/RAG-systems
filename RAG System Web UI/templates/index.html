<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База знаний</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    <!-- Подключаем наш кастомный CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ config['MEMO_JS_VERSION'] }}">

</head>
<body>

    <!-- Оверлей синхронизации -->
    <div id="sync-overlay">
        <div class="sync-card">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Загрузка...</span >
            </div>

            <h3 class="status-text" id="sync-status-text">Подготовка...</h3>
            <div class="text-xs" id="sync-file-text"></div>

            <div class="progress-container">
                <div id="sync-progress-bar" class="progress-bar" style="width: 0%"></div >
                <div class="progress-percent" id="sync-percent-text">0%</div >
            </div>
        </div>
    </div>

    <!-- Топ-бар -->
    <nav class="navbar navbar-expand bg-white border-bottom px-3">
        <span class="navbar-brand mb-0 h5"><i class="bi bi-journal-bookmark-fill me-2"></i>База знаний</span>
        <div class="ms-auto d-flex align-items-center">
            <span class="me-3 text-muted"><i class="bi bi-person-circle me-1"></i>{{ user }}</span>
            {% if user == 'admin' %}
            <a href="{{ url_for('admin') }}" class="btn btn-outline-primary btn-sm me-2" title="Админ-панель">
                <i class="bi bi-gear"></i> Админ
            </a>
            {% endif %}
            <form method="POST" action="{{ url_for('logout') }}" class="m-0">
                <button type="submit" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Выйти
                </button>
            </form>
        </div>
    </nav>

    <!-- Основной контейнер чата -->
    <div class="chat-container">
        <!-- Левая часть с основным чатом -->
        <div class="main-chat-area" id="mainChatArea">
            <div id="chat-container">
                <div class="message-row bot">
                    <div class="message-bubble">
                        <p class="mb-0">Привет! Я готов отвечать на вопросы по вашим документам.</p>
                        <div class="sources-list">
                            <small>Статус: <span id="system-status" class="text-warning">Загрузка системы...</span></small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Область ввода -->
            <div id="input-area">
                <div class="container-fluid p-0">
                    <div class="row g-2 align-items-center">
                        <div class="col">
                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="bi bi-robot"></i>
                                </span>
                                <input type="text" id="question-input" class="form-control" placeholder="Введите вопрос. Служебная записка: /create тема..." disabled>
                            </div>
                            <div id="command-menu-wrap" class="command-menu-wrap d-none">
                                <div id="command-menu" class="command-menu"></div>
                            </div>
                        </div>
                        <div class="col-auto">
                            <button id="send-btn" class="btn btn-primary" disabled>
                                <i class="bi bi-send-fill"></i> Отправить
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Правая панель с историей чатов -->
       <div class="chat-history-panel" id="chatHistoryPanel">
            <div class="history-header">
                <h5 class="mb-0">История</h5>
                <!-- Добавляем кнопку "Новый чат" и сохраняем ее ID для JS -->
                <button id="newChatBtn" class="btn btn-sm btn-outline-primary me-2" title="Начать новый диалог" onclick="startNewChat()">
                    <i class="bi bi-plus-circle"></i>
                </button>
                <button id="clearHistoryBtn" class="btn btn-sm btn-outline-danger" title="Очистить историю">
                    <i class="bi bi-trash"></i>
                </button>
            </div>

            <div class="history-tabs">
                <button class="tab-button active" onclick="switchTab('conversations')">Диалоги</button>
                <button class="tab-button" onclick="switchTab('answers')">Ответы</button>
            </div>

            <div class="history-content" id="historyContent">
                <!-- Контейнеры для разных вкладок -->
                <div id="conversationsTab" style="display: block;">
                    <!-- Здесь будут отображаться элементы диалогов -->
                </div>

                <div id="answersTab" style="display: none;">
                    <!-- Здесь будут отображаться избранные ответы -->
                </div>
            </div>
        </div>
    </div>


    <!-- Модальное окно -->
    <div class="modal fade" id="fileModal" tabindex="-1" aria-labelledby="fileModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
          </div>
          <div class="modal-body">
           <div class="mb-3">
              <label class="form-label">Путь к файлу:</label>
              <div class="input-group">
                <input type="text" class="form-control" id="filePath" readonly>
                <button class="btn btn-outline-secondary" type="button" id="copyButton" onclick="copyFilePath()">
                  <i class="bi bi-clipboard"></i>
                </button>
              </div>
            </div>

            <!-- Спиннер загрузки -->
            <div id="spinner" class="text-center" style="display: none;">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Загрузка...</span >
              </div>
              <p class="mt-2">Обработка файла...</p>
            </div >

            <!-- Ошибки -->
            <div id="error-message" class="alert alert-danger" style="display: none;"></div>

            <!-- Результат -->
            <div id="result-content"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            <button type="button" class="btn btn-primary d-none" id="parseBtn">Парсить файл</button>
          </div>
        </div>
      </div>
    </div>


    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
    <!-- Подключаем основной JS скрипт -->
    <script src="{{ url_for('static', filename='js/main.js') }}?v={{ config['MEMO_JS_VERSION'] }}"></script>
    <!-- Мастер служебной записки -->
    <script src="{{ url_for('static', filename='js/memo.js') }}?v={{ config['MEMO_JS_VERSION'] }}"></script>

</body>
</html>
