<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Word Парсера (.doc/.docx)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
    <style>
        body { background-color: #f8f9fa; padding-top: 2rem; }
        .container { max-width: 900px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        #result-area {
            min-height: 200px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }
        /* Стили для контента */
        #result-content h1, #result-content h2, #result-content h3 { color: #2c3e50; margin-top: 0; }
        #result-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        #result-content th, #result-content td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        #result-content th { background-color: #f2f2f2; }
        #result-content pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .loading-spinner { display: none; text-align: center; margin: 20px 0; }
        .hint-text { font-size: 0.9rem; color: #6c757d; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h2 class="text-center">🧪 Тестирование Word Парсера</h2>
            <p class="text-center text-muted">Поддержка .docx, .doc и .pdf</p>
        </div>
    </div>

    <div class="card p-4">
        <div class="mb-3">
            <label for="filePath" class="form-label">Полный путь к файлу</label>
            <input type="text" class="form-control" id="filePath" placeholder="Например: /home/user/docs/report.docx или C:\Docs\report.doc">
            <div class="hint-text">
                💡 Вставьте полный путь к файлу на диске. Сервер должен иметь доступ к этому пути.<br>
                Поддерживаются форматы: <code>.docx</code> и <code>.doc</code>.
            </div>
        </div>

        <button id="parseBtn" class="btn btn-primary w-100">Обработать файл</button>

        <div class="loading-spinner" id="spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
            <p class="mt-2">Обработка документа...</p>
        </div>

        <div id="error-message" class="alert alert-danger mt-3" style="display: none;"></div>

        <h5 class="mt-4">Результат:</h5>
        <div id="result-area">
            <div id="result-content" class="text-muted">Здесь появится результат в формате Markdown...</div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-outline-secondary">Вернуться на главную</a>
    </div>
</div>

<script>
    document.getElementById('parseBtn').addEventListener('click', async () => {
        const filePathInput = document.getElementById('filePath');
        const filePath = filePathInput.value.trim();
        const spinner = document.getElementById('spinner');
        const resultContent = document.getElementById('result-content');
        const errorMsg = document.getElementById('error-message');
        const parseBtn = document.getElementById('parseBtn');

        // Сброс интерфейса
        errorMsg.style.display = 'none';
        resultContent.innerHTML = '';

        if (!filePath) {
            showError('Пожалуйста, введите путь к файлу.');
            return;
        }

        // UI состояние загрузки
        spinner.style.display = 'block';
        parseBtn.disabled = true;

        try {
            const response = await fetch('/rag/parse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_path: filePath })
            });

            const data = await response.json();

            if (response.ok && data.ok) {
                // Рендерим Markdown
                resultContent.innerHTML = marked.parse(data.content);
            } else {
                showError(data.error || 'Произошла ошибка при обработке');
            }
        } catch (err) {
            showError('Ошибка сети: ' + err.message);
        } finally {
            spinner.style.display = 'none';
            parseBtn.disabled = false;
        }
    });

    function showError(message) {
        const errorMsg = document.getElementById('error-message');
        errorMsg.textContent = message;
        errorMsg.style.display = 'block';
    }

    // Обработка нажатия Enter в поле ввода
    document.getElementById('filePath').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            document.getElementById('parseBtn').click();
        }
    });
</script>

</body>
</html>
