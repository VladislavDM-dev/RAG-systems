<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - База знаний</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-icon {
            font-size: 3rem;
            color: #0d6efd;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon"><i class="bi bi-person-plus-fill"></i></div>
        <h4 class="text-center mb-4">Регистрация</h4>

        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register_submit') }}">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" name="username" class="form-control form-control-lg"
                       placeholder="Логин" value="{{ username or '' }}" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control form-control-lg"
                       placeholder="Пароль" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Повторите пароль</label>
                <input type="password" name="password2" class="form-control form-control-lg"
                       placeholder="Повторите пароль" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="bi bi-check2-circle me-2"></i>Зарегистрироваться
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login_page') }}" class="text-muted">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</body>
</html>
